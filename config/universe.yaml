us:
  sector_map:
    AAPL: IT
    MSFT: IT
    NVDA: IT
  cik:
    AAPL: "0000320193"
    MSFT: "0000789019"
    NVDA: "0001045810"

macro:
  # FRED's CSV endpoint needs no API key, which keeps us inside the free-only rule.
  fred_series:
    DGS10: "US 10Y Treasury yield"
    DGS2: "US 2Y Treasury yield"
    CPIAUCSL: "US CPI"
    VIXCLS: "CBOE volatility index"

# GDELT allows one request every 5s and throttles hard past that, and Google News RSS
# costs ~1.5s per ticker. Both are bounded to the names the demo actually narrates;
# every other ticker still gets prices, fundamentals and macro.
gdelt_tickers:
  - TCS.NS
  - INFY.NS
  - HDFCBANK.NS
  - RELIANCE.NS

news_tickers:
  - TCS.NS
  - INFY.NS
  - HDFCBANK.NS
  - ICICIBANK.NS
  - RELIANCE.NS
  - ITC.NS
  - TATAMOTORS.NS
  - SUNPHARMA.NS

# An explicit start date, not a rolling window. The Covid rewind is the single best
# moment in the demo and it needs Feb-Mar 2020 in the snapshot -- a relative period
# quietly slid the window forward and left 2020 out entirely.
history_start: "2019-06-01"
