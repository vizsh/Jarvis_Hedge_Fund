    ICICIBANK.NS: FINANCIALS
    KOTAKBANK.NS: FINANCIALS
    AXISBANK.NS: FINANCIALS
    SBIN.NS: FINANCIALS
    BAJFINANCE.NS: FINANCIALS
    BAJAJFINSV.NS: FINANCIALS
    INDUSINDBK.NS: FINANCIALS
    SBILIFE.NS: FINANCIALS
    HDFCLIFE.NS: FINANCIALS

    # --- FMCG ---
