# Coverage universe.
#
# Expanded from 14 hand-picked names to the NIFTY 50 plus a few mid-cap IT names and
# the index itself. The reason is usability, not completeness: with 14 tickers nobody
# could enter their own portfolio, which made the whole product a diorama. A real
# Indian retail portfolio is mostly drawn from this list.
#
# Sectors are grouped for RISK, not for taxonomy. NTPC and POWERGRID sit in UTILITIES
# rather than ENERGY because they behave like regulated utilities; the point of a
# sector cap is to bound things that fall together.

benchmark:
  ticker: "^NSEI"
  label: "NIFTY 50"

india:
  sector_map:
    # --- IT ---
    TCS.NS: IT
    INFY.NS: IT
    WIPRO.NS: IT
    HCLTECH.NS: IT
    TECHM.NS: IT
    LTTS.NS: IT
    TATAELXSI.NS: IT
    MPHASIS.NS: IT
    PERSISTENT.NS: IT
    COFORGE.NS: IT

